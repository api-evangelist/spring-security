openapi: 3.2.0
info:
  title: Spring Security OAuth2 Session API
  description: Spring Security OAuth2 provides a comprehensive OAuth 2.0 and OpenID Connect implementation for Spring applications. This documents the standard OAuth 2.0 endpoints exposed by Spring Security's resource server and client components, including token endpoints, userinfo, JWKS, and OpenID Connect discovery.
  version: 6.3.0
  contact:
    name: Spring Security Team
    url: https://spring.io/projects/spring-security
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Default application server
tags:
- name: Session
paths:
  /logout:
    post:
      operationId: logout
      summary: Spring Security Logout
      description: Invalidates the current session and clears security context
      tags:
      - Session
      parameters:
      - name: _csrf
        in: query
        required: false
        schema:
          type: string
        description: CSRF token
      responses:
        '302':
          description: Redirect to logout success URL
  /login:
    get:
      operationId: getLoginPage
      summary: Get Login Page
      description: Returns the default Spring Security login form
      tags:
      - Session
      responses:
        '200':
          description: Login page HTML
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: processLogin
      summary: Process Login
      description: Processes username/password login form submission
      tags:
      - Session
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                _csrf:
                  type: string
                remember-me:
                  type: string
      responses:
        '302':
          description: Redirect on success or failure
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
