openapi: 3.2.0
info:
  title: Spring Security Keys API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Keys across 2 of this provider''s published API definitions: spring-authorization-server-openapi.yml, spring-security-oauth2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9000
  description: Default authorization server port
- url: http://localhost:8080
  description: Default application server
tags:
- name: Keys
paths:
  /oauth2/jwks:
    get:
      operationId: getJwks
      summary: JSON Web Key Set
      description: Returns public signing keys for JWT verification
      tags:
      - Keys
      responses:
        '200':
          description: JWKS document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
    servers:
    - url: http://localhost:9000
      description: Default authorization server port
components:
  schemas:
    JwksResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
    JwksResponse_2:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
              kid:
                type: string
              use:
                type: string
              alg:
                type: string
              n:
                type: string
              e:
                type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- spring-authorization-server-openapi.yml
- spring-security-oauth2-openapi.yml
