naftiko: 1.0.0-alpha2
info:
  label: Spring Authorization Server API — Device
  description: 'Spring Authorization Server API — Device. 1 operations. Lead operation: Device Authorization Request. Self-contained
    Naftiko capability covering one Spring Security business surface.'
  tags:
  - Spring Security
  - Device
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_SECURITY_API_KEY: SPRING_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: spring-authorization-server-device
    baseUri: http://localhost:9000
    description: Spring Authorization Server API — Device business capability. Self-contained, no shared references.
    resources:
    - name: oauth2-device_authorization
      path: /oauth2/device_authorization
      operations:
      - name: deviceauthorization
        method: POST
        description: Device Authorization Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SPRING_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: spring-authorization-server-device-rest
    port: 8080
    description: REST adapter for Spring Authorization Server API — Device. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/oauth2/device-authorization
      name: oauth2-device-authorization
      description: REST surface for oauth2-device_authorization.
      operations:
      - method: POST
        name: deviceauthorization
        description: Device Authorization Request
        call: spring-authorization-server-device.deviceauthorization
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spring-authorization-server-device-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Authorization Server API — Device. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: device-authorization-request
      description: Device Authorization Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: spring-authorization-server-device.deviceauthorization
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
