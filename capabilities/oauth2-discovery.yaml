naftiko: 1.0.0-alpha2
info:
  label: Spring Security OAuth2 API — Discovery
  description: 'Spring Security OAuth2 API — Discovery. 2 operations. Lead operation: OAuth2 Authorization Server Metadata.
    Self-contained Naftiko capability covering one Spring Security business surface.'
  tags:
  - Spring Security
  - Discovery
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_SECURITY_API_KEY: SPRING_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: oauth2-discovery
    baseUri: http://localhost:8080
    description: Spring Security OAuth2 API — Discovery business capability. Self-contained, no shared references.
    resources:
    - name: .well-known-oauth-authorization-server
      path: /.well-known/oauth-authorization-server
      operations:
      - name: getauthorizationservermetadata
        method: GET
        description: OAuth2 Authorization Server Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: .well-known-openid-configuration
      path: /.well-known/openid-configuration
      operations:
      - name: getopenidconfiguration
        method: GET
        description: OpenID Connect Discovery
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SPRING_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: oauth2-discovery-rest
    port: 8080
    description: REST adapter for Spring Security OAuth2 API — Discovery. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/well-known/oauth-authorization-server
      name: well-known-oauth-authorization-server
      description: REST surface for .well-known-oauth-authorization-server.
      operations:
      - method: GET
        name: getauthorizationservermetadata
        description: OAuth2 Authorization Server Metadata
        call: oauth2-discovery.getauthorizationservermetadata
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/well-known/openid-configuration
      name: well-known-openid-configuration
      description: REST surface for .well-known-openid-configuration.
      operations:
      - method: GET
        name: getopenidconfiguration
        description: OpenID Connect Discovery
        call: oauth2-discovery.getopenidconfiguration
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: oauth2-discovery-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Security OAuth2 API — Discovery. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: oauth2-authorization-server-metadata
      description: OAuth2 Authorization Server Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oauth2-discovery.getauthorizationservermetadata
      outputParameters:
      - type: object
        mapping: $.
    - name: openid-connect-discovery
      description: OpenID Connect Discovery
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oauth2-discovery.getopenidconfiguration
      outputParameters:
      - type: object
        mapping: $.
