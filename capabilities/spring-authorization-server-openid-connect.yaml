naftiko: 1.0.0-alpha2
info:
  label: Spring Authorization Server API — OpenID Connect
  description: 'Spring Authorization Server API — OpenID Connect. 2 operations. Lead operation: OpenID Connect Session Logout.
    Self-contained Naftiko capability covering one Spring Security business surface.'
  tags:
  - Spring Security
  - OpenID Connect
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_SECURITY_API_KEY: SPRING_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: spring-authorization-server-openid-connect
    baseUri: http://localhost:9000
    description: Spring Authorization Server API — OpenID Connect business capability. Self-contained, no shared references.
    resources:
    - name: connect-logout
      path: /connect/logout
      operations:
      - name: oidclogout
        method: GET
        description: OpenID Connect Session Logout
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id_token_hint
          in: query
          type: string
        - name: post_logout_redirect_uri
          in: query
          type: string
        - name: state
          in: query
          type: string
    - name: userinfo
      path: /userinfo
      operations:
      - name: getuserinfo
        method: GET
        description: OpenID Connect UserInfo
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SPRING_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: spring-authorization-server-openid-connect-rest
    port: 8080
    description: REST adapter for Spring Authorization Server API — OpenID Connect. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/connect/logout
      name: connect-logout
      description: REST surface for connect-logout.
      operations:
      - method: GET
        name: oidclogout
        description: OpenID Connect Session Logout
        call: spring-authorization-server-openid-connect.oidclogout
        with:
          id_token_hint: rest.id_token_hint
          post_logout_redirect_uri: rest.post_logout_redirect_uri
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/userinfo
      name: userinfo
      description: REST surface for userinfo.
      operations:
      - method: GET
        name: getuserinfo
        description: OpenID Connect UserInfo
        call: spring-authorization-server-openid-connect.getuserinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spring-authorization-server-openid-connect-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Authorization Server API — OpenID Connect. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: openid-connect-session-logout
      description: OpenID Connect Session Logout
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spring-authorization-server-openid-connect.oidclogout
      with:
        id_token_hint: tools.id_token_hint
        post_logout_redirect_uri: tools.post_logout_redirect_uri
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
    - name: openid-connect-userinfo
      description: OpenID Connect UserInfo
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spring-authorization-server-openid-connect.getuserinfo
      outputParameters:
      - type: object
        mapping: $.
