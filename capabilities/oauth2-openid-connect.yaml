naftiko: 1.0.0-alpha2
info:
  label: Spring Security OAuth2 API — OpenID Connect
  description: 'Spring Security OAuth2 API — OpenID Connect. 2 operations. Lead operation: OpenID Connect UserInfo Endpoint.
    Self-contained Naftiko capability covering one Spring Security business surface.'
  tags:
  - Spring Security
  - OpenID Connect
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_SECURITY_API_KEY: SPRING_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: oauth2-openid-connect
    baseUri: http://localhost:8080
    description: Spring Security OAuth2 API — OpenID Connect business capability. Self-contained, no shared references.
    resources:
    - name: userinfo
      path: /userinfo
      operations:
      - name: getuserinfo
        method: GET
        description: OpenID Connect UserInfo Endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getuserinfopost
        method: POST
        description: OpenID Connect UserInfo Endpoint (POST)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SPRING_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: oauth2-openid-connect-rest
    port: 8080
    description: REST adapter for Spring Security OAuth2 API — OpenID Connect. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/userinfo
      name: userinfo
      description: REST surface for userinfo.
      operations:
      - method: GET
        name: getuserinfo
        description: OpenID Connect UserInfo Endpoint
        call: oauth2-openid-connect.getuserinfo
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: getuserinfopost
        description: OpenID Connect UserInfo Endpoint (POST)
        call: oauth2-openid-connect.getuserinfopost
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: oauth2-openid-connect-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Security OAuth2 API — OpenID Connect. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: openid-connect-userinfo-endpoint
      description: OpenID Connect UserInfo Endpoint
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oauth2-openid-connect.getuserinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: openid-connect-userinfo-endpoint-post
      description: OpenID Connect UserInfo Endpoint (POST)
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: oauth2-openid-connect.getuserinfopost
      outputParameters:
      - type: object
        mapping: $.
